name: blink_clone
description: A UI clone of Blinkit app.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  carousel_slider: ^4.2.1
  google_fonts: ^5.1.0
  cupertino_icons: ^1.0.6
  animated_text_kit: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/categories/
    - assets/images/products/
    - assets/images/banners/
    - assets/images/others/